name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `ytwatch --version`.
      placeholder: ytwatch 0.1.0
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ytwatch doctor`
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Terminal and window manager
      placeholder: foot on sway
